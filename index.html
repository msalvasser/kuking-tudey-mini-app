.section-head{display:flex;justify-content:space-between;align-items:end;gap:10px;margin:22px 0 9px}.section-head h2{margin:0;font:900 31px/.86 "Barlow Condensed",Impact,sans-serif;text-transform:uppercase;letter-spacing:-.02em}.section-head small{font-size:10px;font-weight:800;text-transform:uppercase;color:#aaa39a}.filter-block{margin-top:14px}.filter-label{font:800 14px/1 "Barlow Condensed";text-transform:uppercase;color:#aaa39a;margin-bottom:8px}.chips{display:flex;gap:7px;overflow-x:auto;padding:2px 1px 5px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}.chip{white-space:nowrap;border:1px solid #555;background:#161616;color:#eee;border-radius:999px;padding:8px 11px;font-size:11px;font-weight:800}.chip.active{background:var(--lime);border-color:var(--lime);color:#101010}.chip.pink.active{background:var(--pink);border-color:var(--pink)}
.search{display:flex;gap:8px;margin:6px 0 12px}.search input{flex:1;min-width:0;background:#171717;color:#fff;border:1px solid #555;border-radius:15px;padding:13px 14px;outline:none;font-size:13px;font-weight:700}.search input::placeholder{color:#777}.search input:focus{border-color:var(--lime);box-shadow:0 0 0 2px rgba(207,255,53,.18)}.icon-btn{width:47px;border:1px solid #555;border-radius:15px;background:#171717;color:#fff;font-size:22px}.result-note{font-size:11px;color:#9b958e;font-weight:800;margin:5px 0 10px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.card{position:relative;background:var(--paper);color:var(--ink);border:2px solid #111;border-radius:21px;overflow:hidden;box-shadow:4px 4px 0 #000}.card button{all:unset;display:block;width:100%;cursor:pointer}.art{height:185px;position:relative;overflow:hidden;background:#272727}.art img{width:100%;height:100%;object-fit:cover;display:block;filter:saturate(1.05)}.art:after{content:"";position:absolute;inset:0;background:linear-gradient(135deg,rgba(207,255,53,.18),transparent 35%,rgba(255,117,190,.2));mix-blend-mode:multiply}.photo-cut{position:absolute;right:-4px;bottom:-2px;background:var(--pink);padding:5px 9px;border:2px solid #111;font:800 12px/.9 "Barlow Condensed";transform:rotate(-5deg);z-index:3}.photo-cut.lime{background:var(--lime)}.doodle{position:absolute;left:8px;top:8px;z-index:3;color:#fff;background:#111;padding:5px 8px;font:800 11px/.9 "Barlow Condensed";transform:rotate(-7deg);border:1px solid #fff}.card-body{padding:11px 11px 13px}.eyebrow{display:flex;justify-content:space-between;gap:5px;color:#69635d;font-size:9px;font-weight:900;text-transform:uppercase}.title{margin:6px 0 7px;font:900 25px/.83 "Barlow Condensed",Impact,sans-serif;text-transform:uppercase;letter-spacing:-.02em}.meta{font-size:10px;font-weight:800;color:#6c665f}.tag{display:inline-block;margin-top:8px;border:1px solid #111;background:var(--lime);padding:4px 7px;border-radius:999px;font-size:9px;font-weight:900}.tag.pink{background:var(--pink)}
.empty{border:1px dashed #555;border-radius:18px;padding:24px;text-align:center;color:#aaa;background:#151515;font-weight:700}.panel{border:1px solid #414141;background:#151515;border-radius:22px;padding:15px;margin-top:14px}.panel h3{margin:0 0 8px;font:900 28px/.85 "Barlow Condensed";text-transform:uppercase}.panel p{margin:0 0 12px;color:#aaa39a;font-size:12px;line-height:1.35;font-weight:700}.actions{display:flex;gap:8px;flex-wrap:wrap}.primary,.secondary,.danger{border:1px solid #111;border-radius:15px;padding:12px 14px;font-weight:900;font-size:12px}.primary{background:var(--lime);color:#111;box-shadow:3px 3px 0 #000}.secondary{background:#eee7dc;color:#111}.danger{background:#ffdbed;color:#111}.wide{width:100%}
.shop-section{border:1px solid #454545;background:#151515;border-radius:23px;padding:14px;margin-top:12px}.shop-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:9px}.shop-head h3{margin:0;font:900 27px/.82 "Barlow Condensed";text-transform:uppercase}.shop-head span{font-size:10px;font-weight:900;color:#a39c93}.shop-help{font-size:11px;line-height:1.35;color:#9f9991;margin:-3px 0 10px}.shop-list{display:grid;gap:5px}.shop-row{display:flex;align-items:center;gap:9px;padding:10px 0;border-bottom:1px solid #333}.shop-row:last-child{border-bottom:0}.shop-row input{width:20px;height:20px;accent-color:var(--lime);flex:none}.shop-row.done .shop-name{text-decoration:line-through;color:#67625d}.shop-name{font-size:12px;font-weight:800;line-height:1.15}.shop-qty{margin-left:auto;font-size:10px;color:#aaa;font-weight:900;white-space:nowrap}.source-pill{margin-left:auto;background:#272727;border:1px solid #555;border-radius:999px;padding:3px 6px;font-size:8px;font-weight:900;color:#cfc7be}.manual-add{display:flex;gap:7px;margin-top:10px}.manual-add input{flex:1;background:#0e0e0e;color:#fff;border:1px solid #4a4a4a;border-radius:13px;padding:10px 11px;font-size:11px}.manual-add button{border:1px solid #111;background:var(--pink);border-radius:13px;padding:0 13px;font-weight:900}.progress{height:7px;border-radius:99px;background:#2c2c2c;overflow:hidden;margin:8px 0 12px}.progress i{display:block;height:100%;background:var(--lime);width:0}
.bottom{position:fixed;z-index:30;left:0;right:0;bottom:0;padding:7px 10px calc(7px + var(--safe));background:rgba(11,11,11,.94);backdrop-filter:blur(14px)}.nav{max-width:740px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:5px;border:1px solid #3d3d3d;border-radius:20px;background:#151515;padding:4px}.nav button{border:0;background:transparent;color:#aaa;border-radius:14px;padding:8px 3px 7px;font:800 10px/1.05 "DM Sans"}.nav button .nav-icon{display:block;font-size:17px;line-height:1;margin-bottom:3px}.nav button.active{background:#272727;color:#fff}.nav button[data-tab="today"].active{background:var(--lime);color:#111}.nav button[data-tab="today"] .nav-icon{font-size:20px;color:var(--lime)}.nav button[data-tab="today"].active .nav-icon{color:#111}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.68);z-index:60;display:none;align-items:flex-end}.modal.open{display:flex}.sheet{width:100%;max-height:94vh;overflow:auto;background:var(--paper);color:var(--ink);border:2px solid #111;border-bottom:0;border-radius:28px 28px 0 0;padding:12px 13px calc(28px + var(--safe));animation:up .18s ease-out}@keyframes up{from{transform:translateY(20px);opacity:.7}to{transform:none;opacity:1}}.sheet-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:9px}.sheet-label{font:900 24px/.8 "Barlow Condensed";text-transform:uppercase}.close{width:43px;height:43px;border:2px solid #111;background:var(--pink);border-radius:50%;font-size:24px;font-weight:900;line-height:1}.detail-photo{height:255px;border:2px solid #111;border-radius:23px;overflow:hidden;position:relative;margin-bottom:13px}.detail-photo img{width:100%;height:100%;object-fit:cover}.detail-sticker{position:absolute;left:12px;bottom:11px;background:var(--lime);padding:8px 12px;border:2px solid #111;font:900 18px/.8 "Barlow Condensed";transform:rotate(-4deg)}.detail h2{margin:0;font:900 48px/.78 "Barlow Condensed";text-transform:uppercase;letter-spacing:-.02em}.desc{margin-top:8px;color:#5f5a54;font-size:12px;line-height:1.35;font-weight:700}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:13px 0}.stat{border:2px solid #111;border-radius:14px;background:#fff;padding:9px}.stat b{display:block;font:900 22px/.85 "Barlow Condensed"}.stat small{font-size:8px;font-weight:900;text-transform:uppercase}.detail h3{margin:16px 0 7px;font:900 28px/.8 "Barlow Condensed";text-transform:uppercase}.detail ul,.detail ol{padding-left:20px;margin-top:0;line-height:1.45;font-size:12px;font-weight:700}.detail li{margin:5px 0}.fav{width:43px;height:43px;border:2px solid #111;background:#fff;border-radius:50%;font-size:21px}.form{display:grid;gap:10px}.field label{display:block;font-size:9px;text-transform:uppercase;font-weight:900;margin-bottom:4px}.field input,.field textarea,.field select{width:100%;border:2px solid #111;border-radius:13px;padding:11px;background:#fff;outline:none}.field textarea{min-height:90px;resize:vertical}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.toast{position:fixed;z-index:90;left:50%;bottom:96px;transform:translateX(-50%);background:var(--lime);color:#111;border:2px solid #111;border-radius:999px;padding:10px 14px;font-size:11px;font-weight:900;display:none;box-shadow:3px 3px 0 #000}.toast.show{display:block}
@media(max-width:520px){.hero h1{font-size:51px}.hero{min-height:320px}.hero-photo{width:72%}.grid{gap:8px}.art{height:160px}.title{font-size:22px}.detail h2{font-size:43px}}@media(max-width:360px){.grid{grid-template-columns:1fr}.hero h1{font-size:48px}.hero-copy{max-width:56%}.art{height:210px}}

<body>
<div class="app">
<header class="top"><div class="brand">КУКИНГ <span>ТУДЕЙ*</span></div><div class="mini-note">вкусные рецепты<br>на каждый день</div></header>
<main id="main"></main>
</div>
<nav class="bottom"><div class="nav">
<button data-tab="today" class="active"><span class="nav-icon">✦</span>Сегодня</button>
<button data-tab="recipes"><span class="nav-icon">▦</span>Рецепты</button>
<button data-tab="shop"><span class="nav-icon">▱</span>Закупка</button>
<button data-tab="saved"><span class="nav-icon">♡</span>Сохранённое</button>
</div></nav>
<div id="modal" class="modal" aria-hidden="true"><section class="sheet" role="dialog" aria-modal="true"><div id="sheet"></div></section></div>
<div id="toast" class="toast"></div>
<script src="data/recipes.js"></script>
<script>
(function(){
"use strict";
const tg=window.Telegram&&window.Telegram.WebApp;
if(tg){try{tg.ready();tg.expand();tg.setHeaderColor("#0b0b0b");tg.setBackgroundColor("#0b0b0b");}catch(e){}}
const baseRecipes=Array.isArray(window.COOKING_TODAY_RECIPES)?window.COOKING_TODAY_RECIPES:[];
const keyRecipes="ct_user_recipes_v1",keySaved="ct_saved_v1",keyShopLegacy="ct_shop_v1",keyShop="ct_shop_v2",keyTab="ct_tab_v1",keyBaseDone="ct_base_done_v2";
const safeRead=(k,f)=>{try{const x=JSON.parse(localStorage.getItem(k));return x??f}catch(e){return f}};
const safeWrite=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
let userRecipes=safeRead(keyRecipes,[]),saved=new Set(safeRead(keySaved,[])),legacyShop=safeRead(keyShopLegacy,[]),shopItems=safeRead(keyShop,null),baseDone=safeRead(keyBaseDone,{}),tab=safeRead(keyTab,"today"),query="",timeFilter="all",proteinFilter="all",recipeType="all";
const allRecipes=()=>[...baseRecipes,...userRecipes];const $=s=>document.querySelector(s),main=$("#main");
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]));
const hash=s=>{let h=0;for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))|0;return Math.abs(h)};
const pick=(a,n)=>a[n%a.length];
const photoFallback="https://images.unsplash.com/photo-1755594461640-b800c6bafdfa?auto=format&fit=crop&fm=jpg&q=82&w=1200";
function photo(r){return r.img||photoFallback}
function mealLabel(r){return r.time==="quick"?"до 20 мин":r.time==="normal"?"20–40 мин":r.time==="cook"?"40–60 мин":r.time==="prep"?"на несколько дней":"—"}
function typeLabel(r){return r.type==="sauce"?"соус":r.type==="prep"?"заготовка":r.type==="dessert"?"десерт":r.type==="side"?"гарнир":r.type==="constructor"?"конструктор":"блюдо"}
function proteinLabel(p){return ({chicken:"Курица",beef:"Говядина",pork:"Свинина",shrimp:"Креветки",egg:"Яйца",tuna:"Тунец",veg:"Овощи",all:"Всё"}[p]||"Всё")}
function card(r,i){const isSaved=saved.has(r.n), accent=i%3===0?"lime":"pink";return `<article class="card"><button type="button" data-open="${esc(r.n)}"><div class="art"><img src="${esc(photo(r))}" alt="${esc(r.n)}" loading="lazy" onerror="this.src='${photoFallback}'"><span class="doodle">${i%2?"ГОТОВИМ ↓":"♥ ЛЮБИМОЕ"}</span><span class="photo-cut ${accent}">${mealLabel(r)}</span></div><div class="card-body"><div class="eyebrow"><span>${esc(typeLabel(r))}</span><span>${esc(proteinLabel(r.p))}</span></div><div class="title">${esc(r.n)}</div><div class="meta">${esc(r.k||"—")} ккал ${r.m?"· "+esc(r.m):""}</div><span class="tag ${isSaved?"pink":""}">${isSaved?"♥ сохранено":"♡ сохранить"}</span></div></button></article>`}
function renderToday(){const all=allRecipes();let arr=all.filter(r=>(timeFilter==="all"||r.time===timeFilter)&&(proteinFilter==="all"||r.p===proteinFilter));if(!arr.length)arr=all.filter(r=>proteinFilter==="all"||r.p===proteinFilter);arr=arr.sort((a,b)=>a.mins-b.mins).slice(0,8);return `<section class="hero"><div class="hero-tape">ВКУСНО · ПРОСТО · ДОМА</div><div class="star">✳</div><h1>ЧТО БУДЕМ<br><span>ЕСТЬ?</span></h1><div class="hero-copy">Семейная книга рецептов без лишнего пафоса. Выбирай настроение, время и продукт — остальное мы уже придумали.</div><img class="hero-photo" src="${esc(photo(arr[0]||all[0]))}" alt="Еда" onerror="this.src='${photoFallback}'"><div class="scribble">готовь с удовольствием ♥</div></section>
<div class="filter-block"><div class="filter-label">1 · Сколько есть времени?</div><div class="chips">${[["all","Любое время"],["quick","⚡ до 20 мин"],["normal","🍳 20–40 мин"],["cook","🍲 40–60 мин"],["prep","📦 на несколько дней"]].map(([v,l])=>`<button class="chip ${timeFilter===v?"active":""}" data-time-filter="${v}">${l}</button>`).join("")}</div></div>
<div class="filter-block"><div class="filter-label">2 · Что есть из главного?</div><div class="chips">${[["all","Всё"],["chicken","Курица"],["beef","Говядина"],["pork","Свинина"],["shrimp","Креветки"],["egg","Яйца"],["tuna","Тунец"],["veg","Овощи"]].map(([v,l])=>`<button class="chip pink ${proteinFilter===v?"active":""}" data-protein-filter="${v}">${l}</button>`).join("")}</div></div>
<div class="section-head"><h2>Сегодня актуально</h2><small>${arr.length} вариантов</small></div><div class="grid">${arr.map((r,i)=>card(r,i)).join("")}</div>
<section class="panel"><h3>Не знаешь, чего хочется?</h3><p>Открой «Рецепты» — там можно искать по названию, ингредиентам, времени и основному продукту одновременно.</p><button class="primary wide" data-tab-jump="recipes">ОТКРЫТЬ ВСЕ РЕЦЕПТЫ →</button></section>`}
function matches(r){const q=query.toLowerCase().trim();const hay=[r.n,r.d,r.p,r.type,...(r.tags||[]),...(r.ing||[])].join(" ").toLowerCase();return(!q||hay.includes(q))&&(timeFilter==="all"||r.time===timeFilter)&&(proteinFilter==="all"||r.p===proteinFilter)&&(recipeType==="all"||r.type===recipeType)}
function recipeResults(){const arr=allRecipes().filter(matches);return `${arr.length?`<div class="grid">${arr.map((r,i)=>card(r,i)).join("")}</div>`:`<div class="empty">Ничего не нашли. Попробуй другой запрос или сбрось фильтр.</div>`}`}
function recipeFilters(){return `<div class="filter-block"><div class="filter-label">Время</div><div class="chips">${[["all","Любое"],["quick","⚡ до 20"],["normal","🍳 20–40"],["cook","🍲 40–60"],["prep","📦 meal prep"]].map(([v,l])=>`<button class="chip ${timeFilter===v?"active":""}" data-time-filter="${v}">${l}</button>`).join("")}</div></div><div class="filter-block"><div class="filter-label">Основной ингредиент</div><div class="chips">${[["all","Всё"],["chicken","Курица"],["beef","Говядина"],["pork","Свинина"],["shrimp","Креветки"],["egg","Яйца"],["tuna","Тунец"],["veg","Овощи"]].map(([v,l])=>`<button class="chip pink ${proteinFilter===v?"active":""}" data-protein-filter="${v}">${l}</button>`).join("")}</div></div><div class="filter-block"><div class="filter-label">Тип</div><div class="chips">${[["all","Всё"],["dish","Блюда"],["prep","Заготовки"],["sauce","Соусы"],["side","Гарниры"],["dessert","Десерты"],["constructor","Конструктор"]].map(([v,l])=>`<button class="chip ${recipeType===v?"active":""}" data-type-filter="${v}">${l}</button>`).join("")}</div></div>`}
function renderRecipes(){const count=allRecipes().filter(matches).length;return `<div class="section-head"><h2>Рецепты</h2><small>${count} найдено</small></div><div class="search"><input id="q" value="${esc(query)}" placeholder="Искать: курица, паста, грибы..."><button class="icon-btn" data-action="clearq">×</button></div>${recipeFilters()}<div class="result-note">Поиск учитывает название, описание, теги и ингредиенты.</div><div id="recipeResults">${recipeResults()}</div><section class="panel"><div class="actions"><button class="primary" data-action="add">＋ ДОБАВИТЬ РЕЦЕПТ</button><button class="secondary" data-action="export">Экспорт моих</button><button class="secondary" data-action="import">Импорт JSON</button></div></section>`}
function renderSaved(){const arr=allRecipes().filter(r=>saved.has(r.n));return `<div class="section-head"><h2>Сохранённое</h2><small>${arr.length}</small></div>${arr.length?`<div class="grid">${arr.map((r,i)=>card(r,i)).join("")}</div>`:`<div class="empty">Пока пусто. Сохраняй рецепты сердечком — они появятся здесь.</div>`}<section class="panel"><h3>Твои рецепты</h3><p>Добавляй семейные блюда прямо из Telegram. Они сохраняются на этом устройстве.</p><button class="primary" data-action="add">＋ ДОБАВИТЬ СВОЙ РЕЦЕПТ</button></section>`}
const permanentBase=["куриное филе/бедро","говядина","говяжий фарш","креветки","яйца","тунец консервированный","куриная печень","свинина для BBQ","греческий йогурт","творог","твёрдый сыр/пармезан","фета","сливки","сметана","творожный сыр","сливочное масло","лук","чеснок","морковь","болгарский перец","кабачок","брокколи","грибы","томаты/черри","картофель","зелень","лимоны","паста/спагетти","рис","гречка","булгур","лапша/рамен","соевый соус","горчица","пасcата/томат","томатная паста","песто","мёд","коричневый сахар","масло","яблочный уксус","куриный бульон","кунжут","кимчи","квашеная капуста","корнишоны","ферментированные овощи","корейская морковь","соль","чёрный перец","копчёная паприка","паприка","сухие травы","корица","ваниль","разрыхлитель","шоколад"];
function migrateShop(){if(!Array.isArray(shopItems)&&Array.isArray(legacyShop)&&legacyShop.length){shopItems=legacyShop.map(x=>({id:cryptoRandom(),name:x.name||String(x),qty:x.qty||"",source:"старый список",done:!!x.done}));saveShop()}else if(!Array.isArray(shopItems))shopItems=[]}
function cryptoRandom(){return Math.random().toString(36).slice(2)+Date.now().toString(36)}
// v1 used the same key for an array. Keep it intact, but move it to recipe additions only.
migrateShop();
function saveShop(){safeWrite(keyShop,shopItems);safeWrite(keyBaseDone,baseDone)}
function addRecipeIngredients(r){(r.ing||[]).forEach(raw=>{if(!raw||/по желанию|не указаны/i.test(raw))return;const name=String(raw).replace(/^\s*\d+[\d\s.,–—-]*(?:г|кг|мл|л|шт\.?|упаковка|ст\.\s*л\.?|ч\.\s*л\.?)?\s*/i,"").trim();const clean=name||String(raw).trim();if(!shopItems.some(x=>x.name.toLowerCase()===clean.toLowerCase()&&x.source===r.n))shopItems.push({id:cryptoRandom(),name:clean,qty:String(raw).startsWith(clean)?"":String(raw).slice(0,Math.max(0,String(raw).indexOf(clean))).trim(),source:r.n,done:false})});saveShop();toast("Ингредиенты добавлены в закупку")}
function addManual(name){name=name.trim();if(!name)return;if(!shopItems.some(x=>x.name.toLowerCase()===name.toLowerCase()&&x.source==="моё"))shopItems.push({id:cryptoRandom(),name,qty:"",source:"моё",done:false});saveShop();render()}
function shopSection(title,items,kind){const done=items.filter(x=>x.done).length;return `<section class="shop-section"><div class="shop-head"><h3>${title}</h3><span>${done}/${items.length}</span></div>${kind==="base"?`<div class="shop-help">Эта база всегда здесь. Она не удаляется — каждую неделю просто отмечай, что уже куплено.</div>`:""}<div class="progress"><i style="width:${items.length?Math.round(done/items.length*100):0}%"></i></div><div class="shop-list">${items.map((x,i)=>`<label class="shop-row ${x.done?"done":""}"><input type="checkbox" data-shop-kind="${kind}" data-shop-id="${esc(x.id)}" ${x.done?"checked":""}><span class="shop-name">${esc(x.name)}</span>${x.qty?`<span class="shop-qty">${esc(x.qty)}</span>`:""}${kind!=="base"?`<span class="source-pill">${esc(x.source||"рецепт")}</span>`:""}</label>`).join("")}</div>${kind==="recipe"?`<button class="secondary" style="margin-top:10px" data-action="clearRecipeShop">Очистить добавленное из рецептов</button>`:""}</section>`}
function renderShop(){const baseItems=permanentBase.map(name=>({id:"base:"+name,name,qty:"",source:"база",done:!!baseDone[name]}));const recipeItems=shopItems.filter(x=>x.source!=="моё"&&x.source!=="старый список");const manualItems=shopItems.filter(x=>x.source==="моё"||x.source==="старый список");return `<div class="section-head"><h2>Закупка</h2><small>${recipeItems.length+manualItems.length} добавлено</small></div><section class="panel"><h3>Смысл этого раздела</h3><p><b>База недели</b> — универсальные продукты, которые всегда держим в гипермаркете. Ниже — ингредиенты конкретных рецептов и твои ручные добавления.</p><div class="actions"><button class="primary" data-action="newWeek">↻ НОВАЯ НЕДЕЛЯ</button><button class="secondary" data-action="clearDone">Убрать купленное</button></div></section>${shopSection("База недели",baseItems,"base")}${shopSection("Из выбранных рецептов",recipeItems,"recipe")}${manualItems.length?shopSection("Добавлено вручную",manualItems,"manual"):""}<section class="shop-section"><div class="shop-head"><h3>Добавить своё</h3><span>что ещё купить?</span></div><div class="manual-add"><input id="manualShop" placeholder="Например: авокадо, хлеб, кофе"><button data-action="manualAdd">＋</button></div></section>`}
function render(){safeWrite(keyTab,tab);if(tab==="today")main.innerHTML=renderToday();if(tab==="recipes")main.innerHTML=renderRecipes();if(tab==="saved")main.innerHTML=renderSaved();if(tab==="shop")main.innerHTML=renderShop();document.querySelectorAll(".nav button").forEach(b=>b.classList.toggle("active",b.dataset.tab===tab));}
function openRecipe(name){const r=allRecipes().find(x=>x.n===name);if(!r)return;const savedNow=saved.has(r.n);$("#sheet").innerHTML=`<div class="sheet-top"><div class="sheet-label">Рецепт</div><button class="close" type="button" data-action="close" aria-label="Закрыть">×</button></div><div class="detail-photo"><img src="${esc(photo(r))}" alt="${esc(r.n)}" onerror="this.src='${photoFallback}'"><span class="detail-sticker">${esc(mealLabel(r))} · ${esc(typeLabel(r))}</span></div><div style="display:flex;align-items:flex-start;gap:8px"><div style="flex:1"><h2>${esc(r.n)}</h2><div class="desc">${esc(r.d||"")}</div></div><button class="fav" data-action="fav" data-name="${esc(r.n)}">${savedNow?"♥":"♡"}</button></div><div class="stats"><div class="stat"><b>${esc(mealLabel(r))}</b><small>время</small></div><div class="stat"><b>${esc(r.k||"—")}</b><small>ккал / порция</small></div><div class="stat"><b>${esc(r.density||"—")}</b><small>плотность</small></div></div><div class="actions"><button class="primary" data-action="addShop" data-name="${esc(r.n)}">＋ ДОБАВИТЬ В ЗАКУПКУ</button>${userRecipes.some(x=>x.n===r.n)?`<button class="secondary" data-action="deleteRecipe" data-name="${esc(r.n)}">Удалить мой рецепт</button>`:""}</div><h3>Ингредиенты</h3><ul>${(r.ing||[]).map(x=>`<li>${esc(x)}</li>`).join("")}</ul><h3>Как готовить</h3><ol>${(r.steps||[]).map(x=>`<li>${esc(x)}</li>`).join("")}</ol>`;$("#modal").classList.add("open");$("#modal").setAttribute("aria-hidden","false");if(tg){try{tg.BackButton.show();tg.BackButton.offClick(closeModal);tg.BackButton.onClick(closeModal)}catch(e){}}}
function closeModal(){$("#modal").classList.remove("open");$("#modal").setAttribute("aria-hidden","true");if(tg){try{tg.BackButton.hide();tg.BackButton.offClick(closeModal)}catch(e){}}}
function toast(msg){const t=$("#toast");t.textContent=msg;t.classList.add("show");clearTimeout(window.__toast);window.__toast=setTimeout(()=>t.classList.remove("show"),1800)}
function saveState(){safeWrite(keySaved,[...saved]);safeWrite(keyRecipes,userRecipes);saveShop()}
function form(){$("#sheet").innerHTML=`<div class="sheet-top"><div class="sheet-label">Новый рецепт</div><button class="close" type="button" data-action="close">×</button></div><form id="recipeForm" class="form"><div class="field"><label>Название</label><input name="n" required placeholder="Например, паста с креветками"></div><div class="field"><label>Коротко о блюде</label><textarea name="d" placeholder="Что это за рецепт и почему мы его любим?"></textarea></div><div class="form-grid"><div class="field"><label>Время, минут</label><input name="mins" type="number" min="1" max="999" value="30"></div><div class="field"><label>Ккал / порция</label><input name="k" type="number" min="0" max="5000" placeholder="примерно"></div></div><div class="field"><label>Основной ингредиент</label><select name="p"><option value="chicken">Курица</option><option value="beef">Говядина</option><option value="pork">Свинина</option><option value="shrimp">Креветки</option><option value="egg">Яйца</option><option value="tuna">Тунец</option><option value="veg">Овощи</option></select></div><div class="field"><label>Ингредиенты — по одному в строке</label><textarea name="ing" required placeholder="300 г курицы\n200 г пасты\n150 г грибов"></textarea></div><div class="field"><label>Приготовление — шаги по одному в строке</label><textarea name="steps" required placeholder="Нарезать курицу\nОбжарить\nДобавить соус"></textarea></div><div class="actions"><button class="primary" type="submit">Сохранить рецепт</button><button class="secondary" type="button" data-action="close">Отмена</button></div></form>`;$("#recipeForm").addEventListener("submit",e=>{e.preventDefault();const f=new FormData(e.currentTarget),n=String(f.get("n")||"").trim();if(!n)return;const mins=Math.max(1,Math.min(999,Number(f.get("mins"))||30)),time=mins<=20?"quick":mins<=40?"normal":mins<=60?"cook":"prep",r={n,e:"🍽️",time,p:String(f.get("p")),type:"dish",mins,k:String(f.get("k")||"—"),m:"",density:"B",img:"",tags:["мой рецепт"],d:String(f.get("d")||"").trim(),ing:String(f.get("ing")||"").split(/\n+/).map(x=>x.trim()).filter(Boolean),steps:String(f.get("steps")||"").split(/\n+/).map(x=>x.trim()).filter(Boolean),user:true};if(allRecipes().some(x=>x.n.toLowerCase()===n.toLowerCase())){toast("Такой рецепт уже есть");return}userRecipes.push(r);saved.add(r.n);saveState();closeModal();tab="saved";render();toast("Рецепт добавлен ✦")})}
function exportUser(){const blob=new Blob([JSON.stringify(userRecipes,null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="kuking-tudey-my-recipes.json";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)}
function importUser(){const inp=document.createElement("input");inp.type="file";inp.accept=".json,application/json";inp.onchange=()=>{const f=inp.files&&inp.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{try{const arr=JSON.parse(rd.result);if(!Array.isArray(arr))throw Error();userRecipes=[...userRecipes,...arr.filter(x=>x&&x.n&&!allRecipes().some(y=>y.n===x.n))];saveState();render();toast("Импорт готов") }catch(e){toast("Не удалось прочитать JSON")}};rd.readAsText(f)};inp.click()}

document.addEventListener("click",e=>{const b=e.target.closest("button,[data-open]");if(!b)return;if(b.dataset.open){openRecipe(b.dataset.open);return}if(b.dataset.tab){tab=b.dataset.tab;render();return}if(b.dataset.tabJump){tab=b.dataset.tabJump;render();return}if(b.dataset.timeFilter){timeFilter=b.dataset.timeFilter;render();return}if(b.dataset.proteinFilter){proteinFilter=b.dataset.proteinFilter;render();return}if(b.dataset.typeFilter){recipeType=b.dataset.typeFilter;render();return}const a=b.dataset.action;if(!a)return;if(a==="close")closeModal();if(a==="clearq"){query="";render()}if(a==="fav"){const n=b.dataset.name;saved.has(n)?saved.delete(n):saved.add(n);saveState();openRecipe(n)}if(a==="addShop"){const r=allRecipes().find(x=>x.n===b.dataset.name);if(r)addRecipeIngredients(r)}if(a==="add"){$("#modal").classList.add("open");form()}if(a==="export")exportUser();if(a==="import")importUser();if(a==="clearRecipeShop"){shopItems=shopItems.filter(x=>x.source==="моё"||x.source==="старый список");saveShop();render();toast("Рецептурные добавления очищены")}if(a==="newWeek"){baseDone={};shopItems=[];saveShop();render();toast("Новая неделя готова") }if(a==="clearDone"){Object.keys(baseDone).forEach(k=>{if(baseDone[k])baseDone[k]=false});shopItems=shopItems.filter(x=>!x.done);saveShop();render();toast("Купленное убрано") }if(a==="manualAdd"){const inp=$("#manualShop");if(inp)addManual(inp.value)}if(a==="deleteRecipe"){const n=b.dataset.name;userRecipes=userRecipes.filter(x=>x.n!==n);saved.delete(n);saveState();closeModal();render()}});
document.addEventListener("change",e=>{const el=e.target;if(el.matches("[data-shop-kind='base']")){const name=el.dataset.shopId.replace(/^base:/,"");baseDone[name]=el.checked;saveShop();render()}if(el.matches("[data-shop-kind='recipe'],[data-shop-kind='manual']")){const item=shopItems.find(x=>x.id===el.dataset.shopId);if(item){item.done=el.checked;saveShop();render()}}});
document.addEventListener("input",e=>{if(e.target.id!=="q")return;query=e.target.value;const box=$("#recipeResults");if(box)box.innerHTML=recipeResults();});
$("#modal").addEventListener("click",e=>{if(e.target.id==="modal")closeModal()});
render();
})();
</script>
