der-bottom:1px solid #d3cbc0;font-size:11px;font-weight:700}.ing:before{content:"□";font-size:20px}.steps{padding-left:20px;font-size:11px;line-height:1.45;font-weight:600}.steps li{margin-bottom:8px}.fav{border:2px solid #111;background:var(--pink);border-radius:50%;width:44px;height:44px;font-size:23px}.toast{position:fixed;z-index:150;left:50%;bottom:95px;transform:translateX(-50%) translateY(12px);opacity:0;background:var(--lime);color:#111;border:2px solid #111;border-radius:999px;padding:9px 13px;font-size:11px;font-weight:900;transition:.18s;pointer-events:none}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

<body>
<div class="app"><header class="top"><div class="brand">КУКИНГ<br>ТУДЕЙ*</div><div class="top-note">готовь<br>с удовольствием <b>♡</b></div></header><main id="main"></main></div>
<nav class="bottom"><div class="nav"><button data-tab="today" class="active"><span class="nav-icon">⌂</span>Сегодня</button><button data-tab="recipes"><span class="nav-icon">▣</span>Рецепты</button><button data-tab="shop"><span class="nav-icon">🛒</span>Закупка</button><button data-tab="saved"><span class="nav-icon">♡</span>Сохранённое</button></div></nav>
<div id="modal" class="modal" aria-hidden="true"><section class="sheet" role="dialog" aria-modal="true"><div id="sheet"></div></section></div><div id="toast" class="toast"></div>
<script src="data/recipes.js"></script>
<script>
(function(){'use strict';
const tg=window.Telegram&&window.Telegram.WebApp;if(tg){try{tg.ready();tg.expand();tg.setHeaderColor('#080808');tg.setBackgroundColor('#080808')}catch(e){}}
const baseRecipes=Array.isArray(window.COOKING_TODAY_RECIPES)?window.COOKING_TODAY_RECIPES:[];
const K={recipes:'ct_user_recipes_v1',saved:'ct_saved_v1',shop:'ct_shop_v3',oldShop:'ct_shop_v2',tab:'ct_tab_v1',baseDone:'ct_base_done_v3'};
const read=(k,f)=>{try{const v=JSON.parse(localStorage.getItem(k));return v??f}catch(e){return f}};const write=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
let userRecipes=read(K.recipes,[]),saved=new Set(read(K.saved,[])),shopItems=read(K.shop,[]),baseDone=read(K.baseDone,{}),tab=read(K.tab,'today'),query='',timeFilter='all',proteinFilter='all',recipeType='all';
const all=()=>[...baseRecipes,...userRecipes],$=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const meal=r=>({quick:'до 20 мин',normal:'20–40 мин',cook:'40–60 мин',prep:'на несколько дней'}[r.time]||'—');const type=r=>({sauce:'соус',prep:'заготовка',dessert:'десерт',side:'гарнир',constructor:'конструктор'}[r.type]||'блюдо');const prot=p=>({chicken:'курица',beef:'говядина',pork:'свинина',shrimp:'креветки',egg:'яйца',tuna:'тунец',veg:'овощи'}[p]||'');
function fallback(r){const title=String(r.n||'Блюдо').replace(/[&<>]/g,'');const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="760"><rect width="100%" height="100%" fill="#191919"/><circle cx="720" cy="250" r="230" fill="#ff79c5" opacity=".85"/><circle cx="760" cy="300" r="170" fill="#cfff38" opacity=".55"/><path d="M80 620 Q350 450 700 620 T1050 580" fill="none" stroke="#fff" stroke-width="22"/><text x="70" y="130" fill="#fff" font-family="Arial" font-weight="900" font-size="62">КУКИНГ ТУДЕЙ</text><text x="70" y="700" fill="#cfff38" font-family="Arial" font-weight="900" font-size="56">${title}</text></svg>`;return 'data:image/svg+xml;charset=UTF-8,'+encodeURIComponent(svg)}
function photo(r){return r.img||fallback(r)}
function card(r,i){const label=i%4===0?'ХИТ':i%4===1?'ЛЮБИМОЕ':i%4===2?'БЫСТРО':'ДОМАШНИЙ ВКУС';return `<article class="card"><button type="button" data-open="${esc(r.n)}"><div class="art"><img src="${esc(photo(r))}" alt="${esc(r.n)}" loading="lazy" data-fallback="${esc(fallback(r))}"><span class="scribble-tag ${i%2?'pink':''}">${label}</span><span class="hand">${i%3===0?'очень вкусно!':i%3===1?'просто ♥':'попробуй ↓'}</span></div><div class="card-body"><div class="eyebrow"><span>${esc(type(r))}</span><span>${esc(prot(r.p))}</span></div><div class="title">${esc(r.n)}</div><div class="meta">◷ ${esc(r.mins||'—')} мин · ${esc(r.k||'—')} ккал</div><span class="density ${r.density==='D'?'pink':r.density==='A'?'lime':''}">плотность ${esc(r.density||'—')}</span></div></button></article>`}
const timeChips=()=>[['all','Любое'],['quick','⚡ До 20 мин'],['normal','20–40 мин'],['cook','40–60 мин'],['prep','📦 Готовим еду']];const protChips=()=>[['all','Все'],['chicken','Курица'],['beef','Говядина'],['pork','Свинина'],['shrimp','Креветки'],['egg','Яйца'],['tuna','Тунец'],['veg','Овощи']];
function renderToday(){let arr=all().filter(r=>(timeFilter==='all'||r.time===timeFilter)&&(proteinFilter==='all'||r.p===proteinFilter));if(!arr.length)arr=all();arr=arr.slice().sort((a,b)=>(a.mins||999)-(b.mins||999)).slice(0,8);const hero=arr[0]||all()[0];return `<section class="hero"><div class="tape">ВКУСНО · ПРОСТО · ДОМА</div><div class="hero-star">✳</div><h1>ЧТО БУДЕМ<br><span>ЕСТЬ?</span></h1><div class="hero-sub">выбирай и готовь ↓</div><div class="hero-photo-wrap"><img class="hero-photo" src="${esc(photo(hero))}" alt="${esc(hero.n)}" data-fallback="${esc(fallback(hero))}"></div><div class="scribble">готовь с удовольствием</div></section><div class="filter-title">Быстрый выбор · время</div><div class="chips">${timeChips().map(([v,l])=>`<button class="chip ${timeFilter===v?'active':''}" data-time-filter="${v}">${l}</button>`).join('')}</div><div class="filter-title">Основной ингредиент</div><div class="chips">${protChips().map(([v,l])=>`<button class="chip pink ${proteinFilter===v?'active':''}" data-protein-filter="${v}">${l}</button>`).join('')}</div><div class="section-head"><h2>Сегодня актуально</h2><small>${arr.length} вариантов</small></div><div class="grid">${arr.map(card).join('')}</div>`}
function matches(r){const q=query.trim().toLowerCase();const hay=[r.n,r.d,r.p,r.type,...(r.tags||[]),...(r.ing||[])].join(' ').toLowerCase();return(!q||hay.includes(q))&&(timeFilter==='all'||r.time===timeFilter)&&(proteinFilter==='all'||r.p===proteinFilter)&&(recipeType==='all'||r.type===recipeType)}
function filters(){return `<div class="filter-title">Время</div><div class="chips">${timeChips().map(([v,l])=>`<button class="chip ${timeFilter===v?'active':''}" data-time-filter="${v}">${l}</button>`).join('')}</div><div class="filter-title">Основной ингредиент</div><div class="chips">${protChips().map(([v,l])=>`<button class="chip pink ${proteinFilter===v?'active':''}" data-protein-filter="${v}">${l}</button>`).join('')}</div><div class="filter-title">Тип блюда</div><div class="chips">${[['all','Все'],['dish','Блюда'],['prep','Заготовки'],['sauce','Соусы'],['side','Гарниры'],['dessert','Десерты'],['constructor','Конструктор']].map(([v,l])=>`<button class="chip ${recipeType===v?'active':''}" data-type-filter="${v}">${l}</button>`).join('')}</div>`}
function renderRecipes(){const arr=all().filter(matches);return `<div class="section-head"><h2>Рецепты</h2><small>${arr.length} найдено</small></div><div class="search"><input id="q" value="${esc(query)}" placeholder="Поиск рецептов..."><button class="icon-btn" data-action="clearq">×</button></div>${filters()}<div class="result-note">Ищем по названию, ингредиентам, тегам и описанию.</div><div id="recipeResults">${arr.length?`<div class="grid">${arr.map(card).join('')}</div>`:'<div class="empty">Ничего не нашли. Попробуй «курица», «грибы», «паста».</div>'}</div><section class="panel"><div class="actions"><button class="primary" data-action="add">＋ ДОБАВИТЬ РЕЦЕПТ</button><button class="secondary" data-action="export">Экспорт</button><button class="secondary" data-action="import">Импорт</button></div></section>`}
const base=['куриное филе / бедро','говядина','говяжий фарш','креветки','яйца','тунец консервированный','куриная печень','свинина для BBQ','греческий йогурт','творог','пармезан / твёрдый сыр','фета','сливки','сметана','творожный сыр','сливочное масло','лук','чеснок','морковь','болгарский перец','кабачок','брокколи','грибы','томаты / черри','картофель','зелень','лимоны','паста / спагетти','рис','гречка','булгур','лапша / рамен','соевый соус','горчица','пасcата / томат','томатная паста','песто','мёд','коричневый сахар','яблочный уксус','куриный бульон','кунжут','кимчи','квашеная капуста','корнишоны','корейская морковь','соль','чёрный перец','копчёная паприка','паприка','сухие травы','корица','ваниль','разрыхлитель','шоколад'];
function id(){return Math.random().toString(36).slice(2)+Date.now().toString(36)}function saveShop(){write(K.shop,shopItems);write(K.baseDone,baseDone)}function addRecipeIngredients(r){(r.ing||[]).forEach(raw=>{if(!raw||/не указаны/i.test(raw))return;const clean=String(raw).replace(/^\s*[\d\s.,–—-]+(?:г|кг|мл|л|шт\.?|упаковка|ст\.\s*л\.?|ч\.\s*л\.?)?\s*/i,'').trim();if(!clean)return;if(!shopItems.some(x=>x.name.toLowerCase()===clean.toLowerCase()&&x.source===r.n))shopItems.push({id:id(),name:clean,qty:'',source:r.n,done:false})});saveShop();toast('Добавили ингредиенты в закупку');}
function shopBlock(title,items,kind){const done=items.filter(x=>x.done).length;return `<section class="shop-section"><div class="shop-head"><h3>${title}</h3><span>${done}/${items.length}</span></div>${kind==='base'?'<div class="shop-help">Универсальная база автоматически живёт здесь каждую неделю. Отмечай только то, что уже купила.</div>':''}<div class="progress"><i style="width:${items.length?done/items.length*100:0}%"></i></div><div class="shop-list">${items.map(x=>`<label class="shop-row ${x.done?'done':''}"><input type="checkbox" data-shop-kind="${kind}" data-shop-id="${esc(x.id)}" ${x.done?'checked':''}><span class="shop-name">${esc(x.name)}</span>${x.qty?`<span class="shop-qty">${esc(x.qty)}</span>`:''}${kind!=='base'?`<span class="source-pill">${esc(x.source||'моё')}</span>`:''}</label>`).join('')}</div>${kind==='recipe'?'<div class="shop-note">добавляй блюда — список соберётся сам ↓</div><button class="secondary" data-action="clearRecipeShop">Очистить добавленное из рецептов</button>':''}</section>`}
function renderShop(){const b=base.map(n=>({id:'base:'+n,name:n,qty:'',source:'база',done:!!baseDone[n]}));const rec=shopItems.filter(x=>x.source!=='моё');const mine=shopItems.filter(x=>x.source==='моё');return `<div class="section-head"><h2>Закупка</h2><small>план на неделю</small></div><div class="shop-tabs"><button class="shop-tab active">Список</button><button class="shop-tab">База</button><button class="shop-tab">Рецепты</button></div>${shopBlock('База недели',b,'base')}${shopBlock('Из выбранных рецептов',rec,'recipe')}${shopBlock('Мои покупки',mine,'manual')}<section class="shop-section"><div class="shop-head"><h3>Добавить продукт</h3><span>что ещё?</span></div><div class="manual-add"><input id="manualShop" placeholder="авокадо, хлеб, кофе..."><button data-action="manualAdd">＋</button></div><div class="actions" style="margin-top:10px"><button class="primary" data-action="newWeek">↻ НОВАЯ НЕДЕЛЯ</button><button class="secondary" data-action="clearDone">Убрать купленное</button></div></section>`}
function renderSaved(){const arr=all().filter(r=>saved.has(r.n));return `<div class="section-head"><h2>Сохранённое</h2><small>${arr.length}</small></div>${arr.length?`<div class="grid">${arr.map(card).join('')}</div>`:'<div class="empty">Сохраняй рецепты ♡ — они появятся здесь.</div>'}<section class="panel"><h3>Твои рецепты</h3><p>Добавляй свои семейные блюда прямо из Telegram. Они сохраняются на этом устройстве.</p><button class="primary" data-action="add">＋ ДОБАВИТЬ СВОЙ РЕЦЕПТ</button></section>`}
function render(){write(K.tab,tab);main.innerHTML=tab==='today'?renderToday():tab==='recipes'?renderRecipes():tab==='shop'?renderShop():renderSaved();document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));}
function openRecipe(name){const r=all().find(x=>x.n===name);if(!r)return;const is=saved.has(r.n);$('#sheet').innerHTML=`<div class="sheet-top"><div class="sheet-label">Рецепт</div><button class="close" type="button" data-action="close">×</button></div><div class="detail-hero"><img src="${esc(photo(r))}" alt="${esc(r.n)}" data-fallback="${esc(fallback(r))}"><span class="detail-sticker">${esc(meal(r))}</span><div class="detail-title">${esc(r.n)}</div></div><div class="detail-hand">вкусно, просто, по-домашнему ♡</div><div class="stats"><div class="stat"><b>${esc(r.mins||'—')} мин</b><small>готовить</small></div><div class="stat"><b>${esc(r.k||'—')}</b><small>ккал / порция</small></div><div class="stat"><b>${esc(r.density||'—')}</b><small>плотность</small></div></div><div class="actions"><button class="primary wide" data-action="addShop" data-name="${esc(r.n)}">🛒 ДОБАВИТЬ В ЗАКУПКУ</button><button class="fav" data-action="fav" data-name="${esc(r.n)}">${is?'♥':'♡'}</button></div><h3>Ингредиенты</h3><div class="ingredients">${(r.ing||[]).map(x=>`<div class="ing">${esc(x)}</div>`).join('')}</div><h3>Приготовление</h3><ol class="steps">${(r.steps||[]).map(x=>`<li>${esc(x)}</li>`).join('')}</ol>${userRecipes.some(x=>x.n===r.n)?`<button class="danger wide" data-action="deleteRecipe" data-name="${esc(r.n)}">Удалить мой рецепт</button>`:''}`;$('#modal').classList.add('open');$('#modal').setAttribute('aria-hidden','false');if(tg){try{tg.BackButton.show();tg.BackButton.offClick(closeModal);tg.BackButton.onClick(closeModal)}catch(e){}}}
function closeModal(){const m=$('#modal');m.classList.remove('open');m.setAttribute('aria-hidden','true');if(tg){try{tg.BackButton.hide();tg.BackButton.offClick(closeModal)}catch(e){}}}
function toast(s){const t=$('#toast');t.textContent=s;t.classList.add('show');clearTimeout(window.__toast);window.__toast=setTimeout(()=>t.classList.remove('show'),1800)}
function form(){$('#sheet').innerHTML=`<div class="sheet-top"><div class="sheet-label">Добавить рецепт</div><button class="close" data-action="close">×</button></div><form id="recipeForm" class="form"><div class="field"><label>Название</label><input name="n" required placeholder="Например, боул с курицей"></div><div class="field"><label>Описание</label><textarea name="d" placeholder="Коротко о блюде"></textarea></div><div class="form-grid"><div class="field"><label>Минут</label><input name="mins" type="number" value="30" min="1"></div><div class="field"><label>Ккал / порция</label><input name="k" type="number" placeholder="примерно"></div></div><div class="field"><label>Основной ингредиент</label><select name="p"><option value="chicken">Курица</option><option value="beef">Говядина</option><option value="pork">Свинина</option><option value="shrimp">Креветки</option><option value="egg">Яйца</option><option value="tuna">Тунец</option><option value="veg">Овощи</option></select></div><div class="field"><label>Ингредиенты</label><textarea name="ing" required placeholder="300 г курицы\n200 г овощей"></textarea></div><div class="field"><label>Шаги приготовления</label><textarea name="steps" required placeholder="Нарезать...\nОбжарить...\nСмешать..."></textarea></div><button class="primary wide" type="submit">СОХРАНИТЬ РЕЦЕПТ</button></form>`;$('#recipeForm').addEventListener('submit',e=>{e.preventDefault();const f=new FormData(e.currentTarget),n=String(f.get('n')||'').trim();if(!n)return;const mins=Number(f.get('mins'))||30,time=mins<=20?'quick':mins<=40?'normal':mins<=60?'cook':'prep',r={n,e:'🍽️',time,p:String(f.get('p')),type:'dish',mins,k:String(f.get('k')||'—'),m:'',density:'B',img:'',tags:['мой рецепт'],d:String(f.get('d')||''),ing:String(f.get('ing')||'').split(/\n+/).map(x=>x.trim()).filter(Boolean),steps:String(f.get('steps')||'').split(/\n+/).map(x=>x.trim()).filter(Boolean),user:true};if(all().some(x=>x.n.toLowerCase()===n.toLowerCase()))return toast('Такой рецепт уже есть');userRecipes.push(r);saved.add(r.n);write(K.recipes,userRecipes);write(K.saved,[...saved]);closeModal();tab='saved';render();toast('Рецепт добавлен ✦')})}
function exportUser(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(userRecipes,null,2)],{type:'application/json'}));a.download='kuking-tudey-my-recipes.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)}function importUser(){const i=document.createElement('input');i.type='file';i.accept='.json,application/json';i.onchange=()=>{const f=i.files&&i.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const arr=JSON.parse(r.result);if(!Array.isArray(arr))throw 0;userRecipes=[...userRecipes,...arr.filter(x=>x&&x.n&&!all().some(y=>y.n===x.n))];write(K.recipes,userRecipes);render();toast('Импорт готов')}catch(e){toast('Не удалось прочитать JSON')}};r.readAsText(f)};i.click()}
function addManual(v){v=v.trim();if(!v)return;if(!shopItems.some(x=>x.name.toLowerCase()===v.toLowerCase()&&x.source==='моё'))shopItems.push({id:id(),name:v,qty:'',source:'моё',done:false});saveShop();render()}
document.addEventListener('error',e=>{const el=e.target;if(el.tagName==='IMG'&&el.dataset.fallback){el.src=el.dataset.fallback;el.removeAttribute('data-fallback')}},true);
document.addEventListener('click',e=>{const b=e.target.closest('button,[data-open]');if(!b)return;if(b.dataset.open)return openRecipe(b.dataset.open);if(b.dataset.tab){tab=b.dataset.tab;render();return}if(b.dataset.timeFilter){timeFilter=b.dataset.timeFilter;render();return}if(b.dataset.proteinFilter){proteinFilter=b.dataset.proteinFilter;render();return}if(b.dataset.typeFilter){recipeType=b.dataset.typeFilter;render();return}const a=b.dataset.action;if(!a)return;if(a==='close')return closeModal();if(a==='clearq'){query='';render();return}if(a==='fav'){const n=b.dataset.name;saved.has(n)?saved.delete(n):saved.add(n);write(K.saved,[...saved]);openRecipe(n);return}if(a==='addShop'){const r=all().find(x=>x.n===b.dataset.name);if(r)addRecipeIngredients(r);return}if(a==='add'){openAdd();return}if(a==='export')return exportUser();if(a==='import')return importUser();if(a==='manualAdd'){const i=$('#manualShop');if(i)addManual(i.value);return}if(a==='clearRecipeShop'){shopItems=shopItems.filter(x=>x.source==='моё');saveShop();render();toast('Добавления рецептов очищены');return}if(a==='newWeek'){baseDone={};shopItems=[];saveShop();render();toast('Новая неделя готова');return}if(a==='clearDone'){Object.keys(baseDone).forEach(k=>baseDone[k]=false);shopItems=shopItems.filter(x=>!x.done);saveShop();render();toast('Купленное убрано');return}if(a==='deleteRecipe'){const n=b.dataset.name;userRecipes=userRecipes.filter(x=>x.n!==n);saved.delete(n);write(K.recipes,userRecipes);write(K.saved,[...saved]);closeModal();render();return}});
document.addEventListener('change',e=>{const el=e.target;if(el.matches('[data-shop-kind="base"]')){baseDone[el.dataset.shopId.replace(/^base:/,'')]=el.checked;saveShop();render()}else if(el.matches('[data-shop-kind="recipe"],[data-shop-kind="manual"]')){const x=shopItems.find(y=>y.id===el.dataset.shopId);if(x){x.done=el.checked;saveShop();render()}}});
document.addEventListener('input',e=>{if(e.target.id!=='q')return;query=e.target.value;const box=$('#recipeResults');if(box)box.innerHTML=(all().filter(matches).length?`<div class="grid">${all().filter(matches).map(card).join('')}</div>`:'<div class="empty">Ничего не нашли. Попробуй другой запрос.</div>')});
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});
function openAdd(){form();$('#modal').classList.add('open');$('#modal').setAttribute('aria-hidden','false');if(tg){try{tg.BackButton.show();tg.BackButton.offClick(closeModal);tg.BackButton.onClick(closeModal)}catch(e){}}}
render();
})();
</script></body></html>
